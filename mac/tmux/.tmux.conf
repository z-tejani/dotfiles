# TMUX Config


# Keybindinds
## Set prefix key
#unbind C-b              # Unbind the default prefix key
#set -g prefix C-Space   # Set new prefix key to Ctrl+Space

## Switch panes with meta keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

## Use m key to maximize pane
bind -r m resize-pane -Z


# Convenience features
set -g base-index 1 # Start window numbering at 1
set -g detach-on-destroy off # Don't exit from tmux when closing a session
set -g renumber-windows on
set -g set-clipboard on


# Window Style
set -g window-style 'bg=#1e1e2e, fg=white'
set -g window-active-style 'bg=#1e1e2e, fg=white'
set -g pane-border-style fg=colour244   # gray
set -g pane-active-border-style fg=colour39  # cyan


# Status Bar
set -g status-justify left
set -g status-position bottom
set -g status-left "#[fg=#209fb5, bold, bg=#1e1e2e] #S • "
set -g status-right "#[fg=#b4befe, bold, bg=#1e1e2e]%a • %Y-%m-%d • %l:%M %p"
set -g status-left-length 200
set -g status-right-length 200
set -g status-style 'bg=#1e1e2e'
set -g window-status-current-format "#[fg=#dd7878, bg=#1e1e2e] *#I • #W"
set -g window-status-format "#[fg=gray,bg=#1e1e2e] #I • #W"
set -g window-status-last-style "fg=white, bg=black"
